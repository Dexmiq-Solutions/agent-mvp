[project]
name = "agent-mvp"
version = "0.1.0"
description = "Backend for AI Agent / RAG platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
    "voyageai>=0.5.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.20",
    "deepagents>=0.7.18",
    "langchain-openai>=1.6.6",
    "cohere>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/storage",
    "src/exceptions",
    "src/db",
    "src/models",
    "src/rag",
    "src/agents",
    "src/tools",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test.",
]
