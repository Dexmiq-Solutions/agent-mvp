# Alembic configuration for AI Agent / RAG backend

[alembic]
# Path to migration scripts
script_location = alembic

# Path prepended to sys.path so modules in src/ are importable
prepend_sys_path = src

# Migration file naming format
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Max characters for migration slug
truncate_slug_length = 40

# Database URL is dynamically loaded from application settings in env.py.
# Do not hardcode database credentials in this file.
sqlalchemy.url = 

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
